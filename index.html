<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask her out</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Ask Her Out!</h1>
        <form class="form-input">
            <label for="target-name">Her name</label>
            <input type="text" id="target-name" >
            <label for="email">Your email address *</label>
            <input type="email" id="email" required>
            <p>💌 You will receive email when she responds</p>
            <button id="submit">🤍 Create Invitation 🤍</button>
        </form>
    </div>
    <dialog class="modal">
        <h1 id="modal-title">Your invitation is ready!</h1>
        <p>Send this invitation link to her: </p>
        <a class="invi-link" href=""></a>
        <button class="btn-copy" onclick="copyLink()">Copy link</button>
        <form method="dialog">
            <button onclick="closeModal()" class="btn-done">Done</button>
        </form>
    </dialog>
    <script>
        // DOM elements
        const modal = document.querySelector(".modal");
        const form = document.querySelector(".form-input");
        const copyBtn = document.querySelector(".btn-copy");
        const targetNameInput = document.getElementById("target-name");
        const emailInput = document.getElementById("email");
        const inviAnchor = document.querySelector(".invi-link");
        const copiedText = document.createElement('p');
        copiedText.textContent = "Copied!"
        copiedText.style.textAlign = "center";

        form.addEventListener("submit", (e) => {
            e.preventDefault(); // Stop default form submit reload

            const nameValue = encodeURIComponent(targetNameInput.value.trim()); // Optional value
            const emailValue = encodeURIComponent(emailInput.value.trim());

            // Construct custom URL to invitation.html
            const baseURL = window.location.href.substring(0, window.location.href.lastIndexOf("/")+1);
            const generatedURL = `${baseURL}invitation.html?name=${nameValue}&email=${emailValue}`;

            inviAnchor.href = generatedURL;
            inviAnchor.textContent = generatedURL;

            modal.showModal();
        });
        const copyLink = () => {
            navigator.clipboard.writeText(inviAnchor.href);
            copyBtn.replaceWith(copiedText);
        }
        const closeModal = () => {
            copiedText.replaceWith(copyBtn);
        }
    </script>
</body>
</html>
