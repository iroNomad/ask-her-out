<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask her out</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Ask Her Out!</h1>
        <form class="form-input">
            <label for="target-name">Her name</label>
            <input type="text" id="target-name" >
            <label for="email">Your email address *</label>
            <input type="email" id="email" required>
            <button id="submit">🤍 Create the Invitation 🤍</button>
        </form>
    </div>
    <dialog id="submit-modal">
        <div class="yes-modal">
            <h1 id="modal-title">Your invitation is ready!</h1>
            <p>Send this invitation link to her: </p>
            <a href="./invitation.html">CreatetheInvitation-link.comCreatetheInn-link.comn-link.comCreatethe</a>
            <button class="btn-copy" onclick="copiedTextShow()">Copy link</button>
            <form method="dialog">
                <button onclick="closeModal()" class="btn-done">Done</button>
            </form>
        </div>
    </dialog>
    <script>
        const modal = document.getElementById("submit-modal");
        const form = document.querySelector(".form-input");
        const copyBtn = document.querySelector(".btn-copy");
        const copiedText = document.createElement('p');
        copiedText.textContent = "Copied!"
        copiedText.style.textAlign = "center";

        form.addEventListener("submit", (e) => {
            e.preventDefault();
            modal.showModal();
        });
        const copiedTextShow = () => {
            copyBtn.replaceWith(copiedText);
        }
        const closeModal = () => {
            copiedText.replaceWith(copyBtn);
        }
    </script>
</body>
</html>
