<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask her out</title>
    <style>
        body, button, input {
            font-family: Georgia, Garamond, serif;
        }
        h1 {
            font-size: 1.6rem;
            margin: 0 auto 40px;
            text-align: center;
        }
        label {
            font-size: 1.2rem;
        }
        input, button {
            font-size: 1.4rem;
            height: 30px;
            margin-bottom: 10px;
            border-radius: 10px;
            border: none;
        }
        input {
            opacity: 0.8;
            padding: 10px 20px;
        }
        button {
            margin-top: 20px;
            height: 60px;
            border: double 4px;
            color: white;
            background: deeppink;
        }
        button:hover {
            cursor: pointer;
        }
        .card, dialog {
            background: lightpink;
            padding: 5%;
            border: dashed 4px deeppink;
            max-width: 425px;
            margin: 0 auto;
        }
        .form-input {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        dialog {
            margin: auto;
        }
        @media (max-width: 320px) {
            button {
                font-size: 1.2rem;
            }
        }
        .modal-box {
            display: flex;
            flex-direction: column;
            align-self: center;
        }
        .btn-copy {
            align-self: center;
            width: 50%;
            border: none;
            height: 40px;
        }
        .btn-done {
            width: 100%;
        }
        #modal-title {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Ask Her Out!</h1>
        <form class="form-input">
            <label for="target-name">What's her/his name?</label>
            <input type="text" id="target-name" >
            <label for="email">Your email address</label>
            <input type="email" id="email" >
            <button id="submit">🤍 Create the Invitation 🤍</button>
        </form>
    </div>
    <dialog id="submit-modal">
        <div class="modal-box">
            <h1 id="modal-title">Your invitation is ready!</h1>
            <p>Send this invitation link to her: </p>
            <a href="./invitation.html">CreatetheInvitation-link.comCreatetheInn-link.comn-link.comCreatethe</a>
            <button class="btn-copy" onclick="copiedTextShow()">Copy link</button>
            <form method="dialog">
                <button onclick="closeModal()" class="btn-done">Done</button>
            </form>
        </div>
    </dialog>
    <script>
        const modal = document.getElementById("submit-modal");
        const form = document.querySelector(".form-input");
        const copyBtn = document.querySelector(".btn-copy");
        const copiedText = document.createElement('p');
        copiedText.textContent = "Copied!"
        copiedText.style.textAlign = "center";

        form.addEventListener("submit", (e) => {
            e.preventDefault();
            modal.showModal();
        });
        const copiedTextShow = () => {
            copyBtn.replaceWith(copiedText);
        }
        const closeModal = () => {
            copiedText.replaceWith(copyBtn);
        }
    </script>
</body>
</html>
